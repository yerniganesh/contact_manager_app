<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <script src="https://kit.fontawesome.com/dd8c49730d.js" crossorigin="anonymous"></script>
  <title>Contacts Manager</title>
</head>

<body>
  <main class="container">
    <!-- Contact List -->
    <section class="ListContainer">
      <h2>Contacts</h2>
      <div id="people" class="Contact_list"></div>
    </section>

    <!-- Add Contact Form -->
    <form autocomplete="off" class="js-form">
      <h2>Add Contact</h2>

      <div class="input-group">
        <i class="far fa-user"></i>
        <input type="text" id="fullName" placeholder="Enter name" required />
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="myEmail" placeholder="Enter email" required />
      </div>

      <div class="input-group">
        <i class="fas fa-phone-alt"></i>
        <input type="tel" id="myTel" placeholder="Enter number" required />
      </div>

      <div class="input-group">
        <i class="far fa-image"></i>
        <input type="url" id="imgurl" placeholder="Enter image URL" required />
      </div>

      <div class="preview">
        <img id="imgPreview" src="" alt="Image Preview" />
      </div>

      <button type="submit" class="submitbtn">Add Contact</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>

</html>
